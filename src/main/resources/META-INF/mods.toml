modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/BaraAoi/realLaif/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
Суровая реальная жизнь: банк, вклады, кредиты, кредитный рейтинг, ипотека на дома
(от землянки до пентхауса с бассейном), коллекторы Жора и Александр, полиция и тюрьма.
А также МФО «Шайкин и Ко» — микрозаймы под бандитские проценты.
'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${loader_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
